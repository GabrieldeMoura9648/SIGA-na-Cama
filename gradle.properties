# Project-wide Gradle settings.
# Use the compatible JetBrains JBR Java 21 runtime instead of the incompatible Android Studio JBR 25 build.
org.gradle.java.home=C:/Users/user/.jdks/jbr-21.0.11

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style for this project:
kotlin.code.style=official

# Enables namespacing of R classes
android.nonTransitiveRClass=true
